<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Global Notes Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f7fb;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Two Column Layout */
        .column {
            flex: 1;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 400px;
        }
        h2 {
            margin-top: 0;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
            color: #2d3748;
        }
        /* Form Styling */
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .btn-add {
            background-color: #4299e1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-add:hover {
            background-color: #3182ce;
        }
        /* Data Feed List Styling */
        .data-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
        }
        .data-card {
            background: #f7fafc;
            border-left: 4px solid #4299e1;
            padding: 15px;
            border-radius: 0 6px 6px 0;
        }
        .card-metrics {
            display: flex;
            gap: 15px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .card-note {
            color: #718096;
            word-break: break-word;
        }
        /* Responsive design for phones */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Global Public Dashboard</h1>
        <p>Data added here updates instantly for everyone worldwide.</p>
    </header>

    <div class="container">
        <!-- Column 1: Add New Entry -->
        <div class="column">
            <h2>Add New Entry</h2>
            <div class="input-group">
                <label for="val1">Value 1 (e.g., Metric Name/Amount)</label>
                <input type="text" id="val1" placeholder="Enter first value">
            </div>
            <div class="input-group">
                <label for="val2">Value 2 (e.g., Target/Secondary Data)</label>
                <input type="text" id="val2" placeholder="Enter second value">
            </div>
            <div class="input-group">
                <label for="note">Additional Notes</label>
                <textarea id="note" placeholder="Write your note here..."></textarea>
            </div>
            <button class="btn-add" id="saveBtn">➕ Add Entry</button>
        </div>

        <!-- Column 2: Live View Panel -->
        <div class="column">
            <h2>Live Feed (Shared Globally)</h2>
            <div class="data-list" id="feedContainer">
                <!-- Live entries display here dynamically -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onValue } from "https://gstatic.com";

        // ⚠️ REPLACE THIS CONFIG WITH YOUR OWN FIREBASE CONFIG DETAILS
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_://firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_://firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_://appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'sharedNotes');

        const val1Input = document.getElementById('val1');
        const val2Input = document.getElementById('val2');
        const noteInput = document.getElementById('note');
        const saveBtn = document.getElementById('saveBtn');
        const feedContainer = document.getElementById('feedContainer');

        // Write data on click
        saveBtn.addEventListener('click', () => {
            const v1 = val1Input.value.trim();
            const v2 = val2Input.value.trim();
            const n = noteInput.value.trim();

            if (!v1 || !v2 || !n) {
                alert("Please fill out all fields before adding!");
                return;
            }

            // Push object globally to Firebase
            push(dataRef, {
                value1: v1,
                value2: v2,
                note: n,
                timestamp: Date.now()
            }).then(() => {
                // Clear fields locally on successful upload
                val1Input.value = '';
                val2Input.value = '';
                noteInput.value = '';
            }).catch((error) => {
                console.error("Error saving data: ", error);
            });
        });

        // Listen for live database updates from any client
        onValue(dataRef, (snapshot) => {
            feedContainer.innerHTML = '';
            const data = snapshot.val();
            
            if (!data) {
                feedContainer.innerHTML = '<p style="color:#a0aec0; text-align:center;">No data entries found yet.</p>';
                return;
            }

            // Convert object map into an array and sort descending by newest
            const entries = Object.entries(data).reverse();

            entries.forEach(([key, item]) => {
                const card = document.createElement('div');
                card.className = 'data-card';
                card.innerHTML = `
                    <div class="card-metrics">
                        <span>V1: ${escapeHtml(item.value1)}</span>
                        <span>V2: ${escapeHtml(item.value2)}</span>
                    </div>
                    <div class="card-note">${escapeHtml(item.note)}</div>
                `;
                feedContainer.appendChild(card);
            });
        });

        // Basic XSS Prevention utility function 
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
