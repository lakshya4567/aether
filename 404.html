<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="Aether — 404 Page Not Found. The coordinates you requested do not exist.">
<title>404 — Aether</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap');

:root {
    --bg: #000000;
    --bg2: #08090b;
    --surface: rgba(15, 17, 23, 0.85);
    --surface2: rgba(22, 26, 34, 0.95);
    --text: #f3f4f6;
    --muted: #8d929b;
    --dim: #555b65;
    --line: rgba(255,255,255,.09);
    --line2: rgba(255,255,255,.18);
    --accent: #00ffcc;
    --accent-blue: #38bdf8;
    --accent-glow: rgba(0, 255, 204, 0.25);
    --max: 1400px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; overflow-x: hidden; display: flex; flex-direction: column; justify-content: space-between; }

/* Noise overlay */
body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 999; opacity: .025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

::selection { background: var(--accent); color: #000; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }

/* NAVIGATION */
.nav {
    position: fixed; top: 0; left: 0; width: 100%; height: 78px; z-index: 100;
    display: flex; align-items: center; background: rgba(0,0,0,.85); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--line);
}
.nav-inner { width: min(var(--max), calc(100% - 56px)); margin: auto; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 13px; font-weight: 700; letter-spacing: -.04em; }
.brand-mark { width: 30px; height: 30px; color: var(--accent); }
.brand-name { font-size: 16px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.1em; }
.nav-right { display: flex; align-items: center; gap: 18px; }
.nav-product {
    padding: 10px 18px; border: 1px solid var(--line2); border-radius: 100px; font-size: 12px; font-family: 'JetBrains Mono', monospace; transition: .25s ease;
    background: rgba(0,0,0,0.5);
}
.nav-product:hover { background: var(--accent); color: black; border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

/* CONTAINER & 404 CONTENT */
.container { width: min(var(--max), calc(100% - 56px)); margin: auto; }
.mono { font-family: "DM Mono", monospace; text-transform: uppercase; letter-spacing: .13em; font-size: 10px; }
.label { color: var(--muted); }
.accent { color: var(--accent); }

.not-found-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 160px 24px 100px;
    position: relative;
}

.error-code {
    font-size: clamp(80px, 18vw, 220px);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.05em;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, var(--text) 30%, var(--dim));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
}

.error-title {
    font-size: clamp(24px, 4vw, 42px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
}

.error-desc {
    color: var(--muted);
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    max-width: 540px;
    line-height: 1.6;
    margin-bottom: 40px;
}

.button {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    border: 1px solid var(--line2);
    padding: 16px 28px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    transition: .3s ease;
    background: rgba(20,20,25,0.8);
    backdrop-filter: blur(10px);
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

.button span:last-child {
    font-size: 16px;
    transition: transform .3s ease;
}

.button:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 30px var(--accent-glow);
}

.button:hover span:last-child {
    transform: translate(3px, -3px);
}

/* FOOTER */
.footer { border-top: 1px solid var(--line); padding: 40px 0; width: 100%; }
.footer-inner { width: min(var(--max), calc(100% - 56px)); margin: auto; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-family: "DM Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }

/* CURSOR GLOW */
.cursor-glow {
    position: fixed; width: 350px; height: 350px; border-radius: 50%; pointer-events: none; z-index: 1;
    background: radial-gradient(circle, rgba(0,255,204,.06), transparent 65%); transform: translate(-50%,-50%); transition: opacity .3s;
}
</style>
</head>

<body>

<div class="cursor-glow" id="cursorGlow"></div>

<!-- NAVIGATION -->
<nav class="nav" id="nav">
    <div class="nav-inner">
        <a href="http://aether.isroot.in/" class="brand">
            <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
                <rect x="10" y="10" width="20" height="20" transform="rotate(45 20 20)" stroke="currentColor" stroke-width="1.4"/>
                <path d="M20 7V33M7 20H33" stroke="currentColor" stroke-width=".7" opacity=".5"/>
            </svg>
            <span class="brand-name">AETHER</span>
        </a>

        <div class="nav-right">
            <a href="http://aether.isroot.in/" class="nav-product">Return Home ↗</a>
        </div>
    </div>
</nav>

<!-- 404 CONTENT SECTION -->
<main class="not-found-section">
    <div class="container">
        <div class="mono label" style="margin-bottom: 16px;">// ERROR CODE: 404_NOT_FOUND</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Signal lost in the <span class="accent">Aether</span> network.</h2>
        <p class="error-desc">
            The coordinates or route you requested do not exist or have been reindexed.
            Return to the ecosystem to resume navigation.
        </p>
        <div>
            <a href="http://aether.isroot.in" class="button">
                <span>Return to Ecosystem</span>
                <span>↗</span>
            </a>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="footer">
    <div class="footer-inner">
        <span>© 2026 AETHER SYSTEMS</span>
        <span>ALL RIGHTS RESERVED</span>
    </div>
</footer>

<script>
/* CURSOR LIGHT */
const glow = document.getElementById("cursorGlow");
let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;

window.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function animateGlow() {
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;
    if (glow) {
        glow.style.left = glowX + "px";
        glow.style.top = glowY + "px";
    }
    requestAnimationFrame(animateGlow);
}
animateGlow();
</script>

</body>
</html>
