<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Lost in the Aether</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #ffffff;
            --accent-color: #4facfe;
            --muted-color: #8f94a6;
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* Subtle digital structure background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-linear: linear-gradient(var(--grid-color) 1px, transparent 1px),
                               linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        header, footer, main {
            position: relative;
            z-index: 2;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .status-tag {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        main {
            max-width: 600px;
            margin: auto 0;
        }

        .error-code {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--muted-color);
            line-height: 1.5;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 0.3rem;
            transition: color 0.2s target, border-color 0.2s;
        }

        .btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .arrow {
            margin-left: 0.5rem;
            display: inline-block;
            transition: transform 0.2s;
        }

        .btn:hover .arrow {
            transform: translateX(4px);
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--muted-color);
            font-family: monospace;
        }

        @media (max-width: 768px) {
            body {
                padding: 1.5rem;
            }
            footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aether</div>
        <div class="status-tag">System Alert</div>
    </header>

    <main>
        <div class="error-code">Error // 04 — Structural Void</div>
        <h1>This page has drifted out of structure.</h1>
        <p>The information space you are looking for doesn't exist, or has been moved within the Aether system.</p>
        <a href="https://isroot.in" class="btn">Return to core platform <span class="arrow">↗</span></a>
    </main>

    <footer>
        <div>SIGNAL / LOST</div>
        <div>&copy; 2026 AETHER. BUILT FOR WHAT COMES NEXT.</div>
    </footer>

</body>
</html>
